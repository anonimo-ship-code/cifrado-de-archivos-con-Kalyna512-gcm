plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kalyna.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kalyna.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/versions/**', '/META-INF/MANIFEST.MF']
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
